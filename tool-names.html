<style>
.nm-hero{background:linear-gradient(135deg,#F3EEFF 0%,#FFF9E6 100%);padding:2.5rem 0}
.nm-filters{display:flex;flex-wrap:wrap;gap:0.75rem;margin:1.5rem 0;justify-content:center}
.nm-filters button{padding:0.6rem 1.2rem;border:1.5px solid var(--border);border-radius:999px;background:#fff;cursor:pointer;font-weight:600;transition:all 0.2s}
.nm-filters button.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.nm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:0.75rem;max-width:1000px;margin:0 auto}
.nm-card{background:#fff;padding:1.2rem;border-radius:1rem;border:1px solid var(--border);text-align:center;cursor:pointer;transition:all 0.2s}
.nm-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,0.06);border-color:var(--purple)}
.nm-card .name{font-size:1.2rem;font-weight:700;color:var(--text)}
.nm-card .meaning{font-size:0.82rem;color:var(--muted);margin-top:0.3rem}
.nm-card .origin{display:inline-block;margin-top:0.4rem;padding:0.2rem 0.6rem;font-size:0.7rem;border-radius:999px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em}
.nm-card.boy .origin{background:var(--blue-soft);color:#5B9BD5}
.nm-card.girl .origin{background:var(--pink-soft);color:var(--pink)}
.nm-card.unisex .origin{background:var(--purple-soft);color:var(--purple)}
#name-count{text-align:center;color:var(--muted);font-size:0.9rem;margin-bottom:1rem}
</style>
</head>

<main>
<section class="nm-hero"><div class="container" style="text-align:center">
<p class="eyebrow">Baby Names</p><h1>Baby Name Finder</h1>
<p style="color:var(--muted);max-width:500px;margin:0 auto">Browse hundreds of baby names with meanings and origins. Filter by gender to find the perfect name for your little one.</p>
</div></section>
<section class="section"><div class="container">
<div class="nm-filters">
<button class="active" data-filter="all">All Names</button>
<button data-filter="boy"> Boys</button>
<button data-filter="girl"> Girls</button>
<button data-filter="unisex"> Unisex</button>
</div>
<p id="name-count"></p>
<div class="nm-grid" id="name-grid"></div>
</div></section>

let filter='all';
function render(){
const grid=document.getElementById('name-grid');
const filtered=filter==='all'?names:names.filter(n=>n.gender===filter);
grid.innerHTML=filtered.map(n=>`<div class="nm-card ${n.gender}"><div class="name">${n.name}</div><div class="meaning">${n.meaning}</div><span class="origin">${n.origin}</span></div>`).join('');
document.getElementById('name-count').textContent=`Showing ${filtered.length} names`;
}
document.querySelectorAll('.nm-filters button').forEach(b=>b.addEventListener('click',function(){
document.querySelectorAll('.nm-filters button').forEach(x=>x.classList.remove('active'));
this.classList.add('active');filter=this.dataset.filter;render();
}));
render();
</script>
